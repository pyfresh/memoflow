<!doctype html>
<html>
  <body>
    <h1>Calendar</h1>
    <div class="calendar-header">October 2026</div>
    <table class="calendar-grid">
      <tbody>
        <tr>
          <td class="calendar-day" aria-label="Thursday, October 8, 2026">
            <div class="date-number">8</div>
            <div class="event" title="Homework 1">
              <span class="event-time">11:59p</span>
              <span class="event-title">Homework 1</span>
            </div>
          </td>
          <td class="calendar-day" title="Friday, October 9, 2026">
            <div class="date-number">9</div>
            <div class="event" data-event-id="problem-set">
              <span class="event-time">9:00a</span>
              <span class="event-title">Problem Set</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
